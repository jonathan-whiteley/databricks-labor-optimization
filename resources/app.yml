# Databricks App resource for the Labor IQ demo.
#
# Resource bindings supported by the App's `resources` block in this CLI:
#   - database         -> Lakebase instance (CAN_CONNECT_AND_CREATE only)
#   - serving_endpoint -> Model Serving endpoint (CAN_VIEW / CAN_QUERY / CAN_MANAGE)
#   - uc_securable     -> UC objects of type VOLUME / TABLE / FUNCTION / CONNECTION
#                         (SCHEMA is NOT a valid securable_type in the current
#                         AppResourceUcSecurable schema, so schema-level grants
#                         are managed in resources/permissions.yml instead).
#
# source_code_path uses `..` because this resource file lives in resources/ and
# the deployable source (app.yaml at repo root, src/, ui/static, ...) is one
# directory up.

resources:
  apps:
    labor_iq_app:
      name: ${var.app_name}
      description: "Labor IQ: labor optimization demo app for retail, restaurant, and hospitality operators"
      source_code_path: ..
      resources:
        - name: lakebase
          description: "Lakebase Postgres instance backing forecasts/recs/schedules."
          database:
            instance_name: ${var.lakebase_instance}
            database_name: labor_iq
            permission: CAN_CONNECT_AND_CREATE
        - name: labor_endpoint
          description: "Foundation-model serving endpoint for labor recommendations."
          serving_endpoint:
            # Reference the endpoint resource so we pick up the dev-mode prefix
            # (e.g. dev_<user>_labor-iq-rec-v1) instead of the literal
            # var.endpoint_name (labor-iq-rec-v1) which doesn't exist.
            name: ${resources.model_serving_endpoints.labor_iq_endpoint.name}
            permission: CAN_QUERY
      permissions:
        - user_name: ${var.user_email}
          level: CAN_MANAGE
