bundle:
  name: panda-labor-optimization

variables:
  catalog:
    description: Catalog for all data
    default: jdub_demo
  schema:
    description: Schema with Panda data
    default: panda
  app_name:
    description: Databricks App name
    default: labor-iq
  endpoint_name:
    description: Model Serving endpoint
    default: panda-labor-rec-v1
  job_name:
    description: Refresh job
    default: panda_labor_refresh
  lakebase_instance:
    description: Lakebase instance name
    default: panda-labor-db
  user_email:
    description: Owner email
    default: jonathan.whiteley@databricks.com
  genie_space_id:
    description: |
      Panda Labor Planner Genie space ID. Drives the Ask Genie iframe and is
      the input to notebooks/06_ensure_genie_space.py for PATCH semantics.
      Leave blank to have the notebook create a new space and print its ID,
      then pin it here.
    default: 01f14e48463113eda51eff62f704947a

include:
  - resources/*.yml

targets:
  default:
    mode: development
    default: true
    workspace:
      host: https://fe-vm-jdub-vm-serverless.cloud.databricks.com
      profile: DEFAULT
    run_as:
      user_name: ${var.user_email}
