[project]
name = "labor-iq"
version = "0.1.0"
description = "Labor IQ: generic labor optimization demo app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "httpx>=0.28",
    "databricks-sdk>=0.36",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/labor_iq"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
